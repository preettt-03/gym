<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var light = t === "light" || (t === "system" && matchMedia("(prefers-color-scheme: light)").matches);
          var root = document.documentElement;
          root.classList.add(light ? "light" : "dark");
          root.style.colorScheme = light ? "light" : "dark";
          if (light) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f6f5f1");
        } catch (e) {}
      })();
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <title>King's Fitness Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
