name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gym:gym@localhost:5432/gym?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      CORS_ORIGINS: http://localhost:3000,http://localhost:8003

    defaults:
      run:
        working-directory: gym-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gym-backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run prisma:seed
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # docker-compose.yml requires these files to exist (env_file:), even
      # though the values that matter at runtime are overridden below by
      # compose's own `environment:` block for DATABASE_URL/REDIS_URL.
      - name: Write .env files required by docker-compose.yml
        run: |
          cat > gym-backend/.env <<EOF
          NODE_ENV=development
          PORT=8004
          DATABASE_URL=postgresql://gym:gym@localhost:8001/gym?schema=public
          REDIS_URL=redis://localhost:8000
          JWT_ACCESS_SECRET=ci-access-secret
          JWT_REFRESH_SECRET=ci-refresh-secret
          CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:8003
          EOF
          cat > gym-queue-worker/.env <<EOF
          NODE_ENV=development
          DATABASE_URL=postgresql://gym:gym@localhost:8001/gym?schema=public
          REDIS_URL=redis://localhost:8000
          EOF

      - name: Build and start the stack
        working-directory: gym-entrypoint
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8004/api/v1/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend never became healthy"
          cd gym-entrypoint && docker compose logs
          exit 1

      - name: Apply migrations and seed data
        working-directory: gym-backend
        env:
          DATABASE_URL: postgresql://gym:gym@localhost:8001/gym?schema=public
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run prisma:seed

      - name: User-frontend E2E
        working-directory: gym-user-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Admin-frontend E2E
        working-directory: gym-admin-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Show container logs on failure
        if: failure()
        working-directory: gym-entrypoint
        run: docker compose logs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-reports
          path: |
            gym-user-frontend/playwright-report/
            gym-admin-frontend/playwright-report/
          retention-days: 7
